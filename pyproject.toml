[project]
name = "jarvis-kramar"
version = "0.1.0"
description = "AI Butler Jarvis Kramar with Steampunk GUI and Victorian British personality"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "customtkinter>=5.2.0",
    "packaging>=26.0",
    "darkdetect>=0.8.0",
    "speechrecognition>=3.16.0",
    "pyttsx3>=2.99",
    "pyaudio>=0.2.14",
]

[project.scripts]
jarvis-cli = "app.main:main"
jarvis-gui = "app.gui:run_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
